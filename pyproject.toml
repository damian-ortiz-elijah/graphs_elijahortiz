[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphs_elijahortiz"
version = "0.1.0"
description = "A Python library for graph algorithms including Dijkstra's shortest path algorithm"
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/graphs_elijahortiz"]
